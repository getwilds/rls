url: https://getwilds.org/rls
template:
  bootstrap: 5
  light-switch: true
reference:
  - title: rls
    desc: >
      High level overview of package
    contents:
      - rls
  - title: Introspect your database
    contents:
      - rls_current_user
      - rls_list_roles
  - title: Row level security
    contents:
      - rls_check_status
      - rls_drop_policy
      - rls_policy_exists
      - rls_disable
      - rls_enable
      - rls_policies
      - as_row_policy
      - commands
      - row_policy
      - rows_existing
      - rows_new
      - restrictive
  - title: Privileges (aka column level security)
    contents:
      - as_priv
      - revoke
      - grant
      - to
      - from
  - title: Perform column or row security queries
    contents:
      - rls_perform
  - title: Fetch privileges and row level security policies
    contents:
      - rls_column_privileges
      - rls_privileges
      - rls_table_privileges
  - title: Check / verify
    contents:
      - with_db_user
  - title: Utilities
    contents:
      - has_postgres
      - auto_pipe
  - title: Example code/data
    contents:
      - passwd
  - title: Experimental, may change
    contents:
      - rls_col_policy
      - rls_permissions
      - rls_tbl
